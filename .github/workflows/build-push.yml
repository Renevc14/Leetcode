name: build and push docker images

on:
  push:
    branches: [main]
    paths:
      - 'microservices/**'
      - 'smithy/**'
      - 'Dockerfile.service'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/build-push.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: image tag (default git short SHA)
        required: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  build-and-push:
    name: build ${{ matrix.service }}
    # Solo corre cuando la infra de AWS esta lista y el rol OIDC esta
    # configurado en el secret AWS_DEPLOY_ROLE. Hasta entonces, los push a
    # main no disparan builds (los manuales via workflow_dispatch sirven
    # como override para forzar la corrida).
    if: vars.AWS_CI_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - problems-service
          - users-service
          - submissions-service
          - contests-service
          - executor-service
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR login
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: set image tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          fi

      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: build and push (standard service)
        if: matrix.service != 'executor-service'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.service
          build-args: |
            SERVICE=${{ matrix.service }}
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/leetcode/${{ matrix.service }}:${{ steps.tag.outputs.tag }}
            ${{ steps.ecr.outputs.registry }}/leetcode/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: build and push (executor)
        if: matrix.service == 'executor-service'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: microservices/executor-service/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/leetcode/executor-service:${{ steps.tag.outputs.tag }}
            ${{ steps.ecr.outputs.registry }}/leetcode/executor-service:latest
          cache-from: type=gha,scope=executor-service
          cache-to: type=gha,mode=max,scope=executor-service
