services:
  problems-postgres:
    image: postgres:17-alpine
    container_name: problems-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PROBLEMS_POSTGRES_DB:-problems}
      POSTGRES_USER: ${PROBLEMS_POSTGRES_USER:-problems}
      POSTGRES_PASSWORD: ${PROBLEMS_POSTGRES_PASSWORD:-problems}
    ports:
      - '5433:5432'
    volumes:
      - leetcode_problems_data:/var/lib/postgresql/data
      - ./databases/init-problem-service.sql:/docker-entrypoint-initdb.d/01-init-problem-service.sql:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${PROBLEMS_POSTGRES_USER:-problems} -d ${PROBLEMS_POSTGRES_DB:-problems}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  submissions-postgres:
    image: postgres:17-alpine
    container_name: submissions-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SUBMISSIONS_POSTGRES_DB:-submissions}
      POSTGRES_USER: ${SUBMISSIONS_POSTGRES_USER:-submissions}
      POSTGRES_PASSWORD: ${SUBMISSIONS_POSTGRES_PASSWORD:-submissions}
    ports:
      - '5434:5432'
    volumes:
      - leetcode_submissions_data:/var/lib/postgresql/data
      - ./databases/init-submission-service.sql:/docker-entrypoint-initdb.d/01-init-submission-service.sql:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${SUBMISSIONS_POSTGRES_USER:-submissions} -d ${SUBMISSIONS_POSTGRES_DB:-submissions}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  users-postgres:
    image: postgres:17-alpine
    container_name: users-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${USERS_POSTGRES_DB:-users}
      POSTGRES_USER: ${USERS_POSTGRES_USER:-users}
      POSTGRES_PASSWORD: ${USERS_POSTGRES_PASSWORD:-users}
    ports:
      - '5435:5432'
    volumes:
      - leetcode_users_data:/var/lib/postgresql/data
      - ./databases/init-users-service.sql:/docker-entrypoint-initdb.d/01-init-users-service.sql:ro
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${USERS_POSTGRES_USER:-users} -d ${USERS_POSTGRES_DB:-users}']
      interval: 10s
      timeout: 5s
      retries: 5

  contests-postgres:
    image: postgres:17-alpine
    container_name: contests-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CONTESTS_POSTGRES_DB:-contests}
      POSTGRES_USER: ${CONTESTS_POSTGRES_USER:-contests}
      POSTGRES_PASSWORD: ${CONTESTS_POSTGRES_PASSWORD:-contests}
    ports:
      - '5436:5432'
    volumes:
      - leetcode_contests_data:/var/lib/postgresql/data
      - ./databases/init-contests-service.sql:/docker-entrypoint-initdb.d/01-init-contests-service.sql:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${CONTESTS_POSTGRES_USER:-contests} -d ${CONTESTS_POSTGRES_DB:-contests}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: leetcode-redis
    restart: unless-stopped
    command: ['redis-server', '--save', '60', '1', '--loglevel', 'warning']
    ports:
      - '6379:6379'
    volumes:
      - leetcode_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  leetcode_problems_data:
  leetcode_submissions_data:
  leetcode_users_data:
  leetcode_contests_data:
  leetcode_redis_data:
